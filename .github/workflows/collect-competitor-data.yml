name: Collect competitor evidence

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: competitor-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect public competitor evidence
        run: >-
          python collector.py
          --config config/competitors.json
          --output data/collected_competitor_data.csv

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Commit updated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected_competitor_data.csv
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "data: refresh competitor evidence"
            git push
          fi
